name: Telemetry refresh

on:
  schedule:
    # Probe windows are deliberately staggered to avoid synchronized load.
    - cron: "11 7 * * *"
      timezone: "America/Toronto"
    - cron: "37 9 * * *"
      timezone: "America/Toronto"
    - cron: "23 12 * * *"
      timezone: "America/Toronto"
    - cron: "59 14 * * *"
      timezone: "America/Toronto"
    - cron: "41 17 * * *"
      timezone: "America/Toronto"
    - cron: "17 20 * * *"
      timezone: "America/Toronto"
    - cron: "43 22 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telemetry-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the operations branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect simulated service telemetry
        env:
          TELEMETRY_EVENT: ${{ github.event_name }}
          TELEMETRY_RUN_ID: ${{ github.run_id }}
          TELEMETRY_SLOT: ${{ github.event.schedule }}
          TELEMETRY_TIMEZONE: America/Toronto
        run: ./scripts/refresh-telemetry.sh

      - name: Publish the telemetry snapshot
        env:
          COMMIT_NAME: ${{ github.repository_owner }}
          COMMIT_EMAIL: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
        run: |
          if git diff --quiet -- telemetry/STATUS_HISTORY.md; then
            echo "No probe was due in this window."
            exit 0
          fi

          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git add telemetry/STATUS_HISTORY.md
          git commit -m "chore: refresh telemetry at $(TZ=America/Toronto date '+%Y-%m-%d %H:%M %Z')"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

